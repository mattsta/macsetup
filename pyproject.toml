[project]
name = "macsetup"
version = "0.1.0"
description = "Idempotent macOS command-line setup augmentation tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[project.scripts]
macsetup = "macsetup.cli:main"
macsetup-transfer = "macsetup.transfer:main"
mrsync = "macsetup.mrsync:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["macsetup", "macsetup.defaults", "macsetup.defaults.templates"]

[tool.setuptools.package-data]
macsetup = ["py.typed"]
"macsetup.defaults" = ["profile.toml"]
"macsetup.defaults.templates" = ["*"]

[tool.uv]
package = true
