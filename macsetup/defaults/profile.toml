[macos]

[[macos.defaults]]
name = "screenshot-location"
domain = "com.apple.screencapture"
key = "location"
value = "~/Desktop/Screenshots"
value_type = "path"
directories = ["~/Desktop/Screenshots"]
tags = ["macos", "defaults", "screenshots"]

[manual]

[[manual.apps]]
name = "Trello"
install_method = "Mac App Store"
url = "https://apps.apple.com/us/app/trello/id1278508951?mt=12"
tags = ["packages", "apps", "manual", "productivity"]
app_bundles = ["Trello.app"]

[[manual.notes]]
name = "Disable Tips Notifications"
detail = "System Settings -> Notifications -> Tips: turn Allow Notifications off."
tags = ["macos", "manual", "notifications"]

[[manual.notes]]
name = "Disable AirPlay Receiver"
detail = "System Settings -> search AirPlay Receiver, or General -> AirDrop & Handoff: turn AirPlay Receiver off so Control Center does not listen on TCP port 7000."
tags = ["macos", "manual", "network", "privacy"]

[[manual.notes]]
name = "Increase Display Resolution"
detail = "System Settings -> Displays: choose the preferred scaled resolution, usually More Space on high-density displays."
tags = ["macos", "manual", "display"]

[[manual.notes]]
name = "Increase Mouse Sensitivity"
detail = "System Settings -> Mouse: increase Tracking speed and review scrolling direction/speed."
tags = ["macos", "manual", "input"]

[[manual.notes]]
name = "Review Battery And Performance Modes"
detail = "System Settings -> Battery: choose desired Low Power Mode, power adapter behavior, display sleep behavior, and hardware-specific performance mode if present."
tags = ["macos", "manual", "power"]

[[manual.notes]]
name = "Review Screen Saver And Lock Timing"
detail = "System Settings -> Lock Screen and Screen Saver: set screen saver start delay, display-off delay, and require-password timing."
tags = ["macos", "manual", "security", "display"]

[[manual.notes]]
name = "Restrict Spotlight Results"
detail = "System Settings -> Siri & Spotlight -> Search Results: leave Applications enabled and optionally Documents, then disable other categories."
tags = ["macos", "manual", "spotlight", "privacy"]

[[manual.notes]]
name = "Review Login And Background Items"
detail = "System Settings -> General -> Login Items & Extensions: remove unwanted login items and background items."
tags = ["macos", "manual", "startup", "privacy"]

[[git.settings]]
key = "user.useConfigOnly"
value = "true"

[[git.settings]]
key = "core.symlinks"
value = "true"

[[git.settings]]
key = "core.excludesfile"
value = "~/.gitignore_global"

[[git.settings]]
key = "core.editor"
value = "nvim"

[[git.settings]]
key = "core.pager"
value = "delta"

[[git.settings]]
key = "pager.branch"
value = "false"

[[git.settings]]
key = "pager.log"
value = "$HOME/.local/bin/git-log-pager"

[[git.settings]]
key = "pager.show"
value = "delta"

[[git.settings]]
key = "pager.diff"
value = "delta"

[[git.settings]]
key = "init.defaultBranch"
value = "main"

[[git.settings]]
key = "alias.root"
value = "!git rev-list --max-parents=0 HEAD"

[[git.settings]]
key = "alias.llog"
value = "log --pretty=fuller"

[[git.settings]]
key = "alias.logs"
value = "log --graph --pretty=format:'%C(magenta)%h%Creset -%C(red)%d%Creset %s %C(dim green)(%cr) %C(cyan)<%an>%Creset' --abbrev-commit"

[[git.settings]]
key = "alias.rl"
value = "reflog --format='%C(auto)%h %<|(20)%gd %C(blue)%cr%C(reset) %gs (%s)'"

[[git.settings]]
key = "alias.tagdate"
value = "log --date-order --graph --tags --simplify-by-decoration --pretty=format:\"%ai %h %d\""

[[git.settings]]
key = "alias.branchbydate"
value = "for-each-ref --count=30 --sort=-committerdate refs/heads/ --format='%(refname:short)'"

[[git.settings]]
key = "alias.branchcolor"
value = "!for ref in $(git for-each-ref --sort=-committerdate --format=\"%(refname)\" refs/heads/ refs/remotes ); do git log -n1 $ref --pretty=format:\"%Cgreen%cr%Creset %C(yellow)%d%Creset %C(bold blue)<%an>%Creset%n\" | cat ; done | awk '! a[$0]++'"

[[git.settings]]
key = "alias.gha"
value = "!f() { git remote add $1 https://github.com/$1/$2.git; }; f"

[[git.settings]]
key = "alias.gpr"
value = "!f() { git fetch origin pull/$1/head:$2; }; f"

[[git.settings]]
key = "interactive.diffFilter"
value = "delta --color-only"

[[git.settings]]
key = "delta.navigate"
value = "true"

[[git.settings]]
key = "delta.dark"
value = "true"

[[git.settings]]
key = "delta.line-numbers"
value = "false"

[[git.settings]]
key = "delta.pager"
value = "less -FRX"

[[git.settings]]
key = "delta.side-by-side"
value = "false"

[[git.settings]]
key = "delta.keep-plus-minus-markers"
value = "true"

[[git.settings]]
key = "delta.hunk-header-style"
value = "file line-number syntax"

[[git.settings]]
key = "delta.file-style"
value = "bold blue"

[[git.settings]]
key = "delta.max-line-distance"
value = "0.6"

[[git.settings]]
key = "delta.word-diff-regex"
value = "\\w+"

[[git.settings]]
key = "merge.conflictStyle"
value = "zdiff3"

[[git.settings]]
key = "color.ui"
value = "true"

[[git.settings]]
key = "diff.colorMoved"
value = "default"

[[git.settings]]
key = "diff.colorMovedWS"
value = "allow-indentation-change"

[[git.settings]]
key = "push.followTags"
value = "true"

[[git.settings]]
key = "filter.lfs.clean"
value = "git-lfs clean -- %f"

[[git.settings]]
key = "filter.lfs.smudge"
value = "git-lfs smudge -- %f"

[[git.settings]]
key = "filter.lfs.process"
value = "git-lfs filter-process"

[[git.settings]]
key = "filter.lfs.required"
value = "true"

[dns]
servers = ["8.8.8.8", "4.2.2.1", "4.2.2.2", "4.2.2.3", "4.2.2.4", "4.2.2.5", "4.2.2.6", "8.8.4.4"]
passthrough_domains = ["api.twitter.com", "tpop-api.twitter.com", "old.reddit.com"]
blocked_domains = ["twitter.com", "ycombinator.com", "reddit.com", "redd.it", "facebook.com", "fb.com", "meta.com", "openai.com"]
