[profile]
name = "macsetup-base"
description = "Public, non-private defaults for a modern macOS developer workstation."

[python]
version = "3.14"
versions = ["3.11", "3.12", "3.13", "3.14"]
build_jobs = "auto"
tooling_packages = ["pip", "wheel", "setuptools", "uv", "poetry"]
global_packages = [
  "ipython",
  "pandas",
  "numpy",
  "orjson",
  "pendulum",
  "visidata",
  "litecli",
  "jupyterlab",
  "black",
  "ruff",
